<!-- Mermaid diagram support for GitHub Pages (kramdown/Rouge outputs fenced ```mermaid
     blocks as <pre><code class="language-mermaid">...</code></pre>, which Mermaid.js
     doesn't auto-detect — this converts them to <pre class="mermaid"> before init. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('code.language-mermaid').forEach(function (codeEl) {
      var pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = codeEl.textContent;
      var oldPre = codeEl.closest('pre') || codeEl;
      oldPre.replaceWith(pre);
    });
    if (window.mermaid) {
      mermaid.initialize({ startOnLoad: true, theme: 'default' });
    }
  });
</script>

<!-- Open external / other-repo links in a new tab. Relative links and links back into this
     same repo's own pages stay in the current tab. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var repoBase = location.pathname.split('/').slice(0, 2).join('/'); // e.g. "/git-tutorials"
    document.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!/^https?:\/\//i.test(href)) return; // relative/internal link — leave as-is
      try {
        var url = new URL(href, location.href);
        var isSameRepo = url.origin === location.origin && url.pathname.indexOf(repoBase + '/') === 0;
        if (!isSameRepo) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
        }
      } catch (e) { /* ignore malformed hrefs */ }
    });
  });
</script>
