<!-- Design system: color tokens, dark mode, callouts, nav chrome. See
     assets/css/custom.css and assets/js/custom.js for the implementation;
     kept out of this file so they're easy to find and edit on their own. -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<!-- Open Graph / social sharing — falls back to the page's own title/description
     (set via Jekyll front matter or site.description) so shared links look right. -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Mermaid.js — diagram rendering. Initialization, theme-matching, and the
     kramdown-output-to-mermaid conversion all live in custom.js. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

<script src="{{ '/assets/js/custom.js' | relative_url }}" defer></script>
